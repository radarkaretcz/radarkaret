name: Aktualizace RadarKaret

"on":
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"

  push:
    branches:
      - main
    paths:
      - "update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repository
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstalovat potrebne knihovny
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 deep-translator googlenewsdecoder

      - name: Spustit RadarKaret
        run: |
          python update_news.py

      - name: Zkontrolovat vytvoreny JSON
        run: |
          echo "Kontrola data/news.json"
          ls -la data
          python -m json.tool data/news.json > /dev/null
          echo "news.json je platny JSON"

      - name: Ulozit aktualizovane zpravy
        run: |
          git config user.name "RadarKaret Bot"
          git config user.email "radarkaret-bot@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "Zadne nove zmeny."
          else
            git commit -m "Automaticka aktualizace RadarKaret"
            git push
          fi
