name: Aktualizace RadarKaret

on:
  workflow_dispatch:

  schedule:
    - cron: '15 5 * * *'

  push:
    branches:
      - main
    paths:
      - 'update_news.py'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repository
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Nainstalovat knihovny
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Aktualizovat zpravy
        run: python update_news.py

      - name: Ulozit nove zpravy
        run: |
          git config user.name "RadarKaret Bot"
          git config user.email "radarkaret-bot@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "Zadne nove zmeny."
          else
            git commit -m "Automaticka aktualizace RadarKaret"
            git push
          fi
